name: Daily market research

on:
  schedule:
    # 22:30 UTC is after the regular U.S. market close in both PST and PDT.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily snapshot
        run: python daily_monitor.py

      - name: Commit new observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_research/daily
          if git diff --cached --quiet; then
            echo "No new market observation to commit."
          else
            git commit -m "Record daily market snapshot"
            git push
          fi
