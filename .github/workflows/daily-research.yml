name: Daily market research

on:
  schedule:
    # Two post-close attempts. If the first download is still stale, the
    # second run can capture the completed daily bar without duplicating files.
    - cron: "30 23 * * 1-5"
    - cron: "30 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily snapshot
        run: python daily_monitor.py

      - name: Train and test research model
        run: python model_training.py

      - name: Commit new observation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published_research/daily published_research/model_training
          if git diff --cached --quiet; then
            echo "No new market observation to commit."
          else
            git commit -m "Record daily market snapshot"
            git push
          fi
